[workspace]
resolver = "3"
members = ["core", "app", "camera"]

[workspace.package]
version = "0.1.0-beta.3"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"

[profile.release]
strip = true

# The webcam decodes every phone frame (JPEG); unoptimized that's ~6 fps in a debug build.
[profile.dev.package.zune-jpeg]
opt-level = 3

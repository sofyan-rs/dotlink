[package]
name = "dotlink"
description = "Link your Android phone with this PC"
version.workspace = true
edition.workspace = true
default-run = "dotlink"

[features]
default = ["gui"]
# The window and the tray icon. `--no-default-features` builds the headless daemon + CLI only.
gui = ["dep:gpui", "dep:gpui-platform", "dep:gpui-component", "dep:gpui-kit-assets", "dep:ksni", "dep:ashpd", "dep:tray-icon"]

[dependencies]
dotlink-core = { path = "../core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
qrcode = "0.14.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# GPUI (Zed's UI framework) as published by gpui-kit, and its component library.
gpui = { package = "gpui-pre", version = "=0.3.9", optional = true }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.9", optional = true, features = ["font-kit", "runtime_shaders"] }
gpui-component = { version = "0.8.0", optional = true }
gpui-kit-assets = { version = "0.8.0", optional = true }

# Tray icon. Linux: StatusNotifierItem over D-Bus (KDE, Waybar, GNOME with AppIndicator).
# Windows: `tray-icon` below. TODO(macos): `tray-icon` there too (menu bar item).
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", optional = true }
# The desktop's light/dark setting, read again when gpui's one try at login came too early.
# Same version and runtime (async-io) as gpui's own use, so nothing new is built.
ashpd = { version = "0.13", optional = true, default-features = false, features = ["async-io", "settings"] }
# X11 and Wayland backends only exist on Linux; the same crate as above, with more features.
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.9", optional = true, features = ["x11", "wayland"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }
# Tray icon in the notification area.
tray-icon = { version = "0.21", optional = true }

[target.'cfg(windows)'.build-dependencies]
# The .exe's icon (Explorer, taskbar, Alt-Tab).
winresource = "0.1"

# `cargo packager --release` (cargo install cargo-packager) builds the installers into
# desktop/target/packages. Linux: .deb, AppImage, pacman PKGBUILD. On new distros (Fedora 44)
# the AppImage needs NO_STRIP=1: linuxdeploy's strip is too old for their libraries.
[package.metadata.packager]
product-name = "Dotlink"
identifier = "dev.dotlink.Dotlink"
description = "Link your Android phone with this PC: files, clipboard, remote, shell, webcam, mic"
category = "Utility"
# dotlink-camera: the Windows webcam DLL (an empty library elsewhere).
before-packaging-command = "cargo build --release -p dotlink -p dotlink-camera"
out-dir = "../target/packages"
binaries = [{ path = "dotlink", main = true }]
icons = ["assets/icons/*.png", "assets/dotlink.ico"]
# Windows: the camera DLL next to dotlink.exe (Setup installs it for the frame server). The
# pattern matches nothing on Linux.
resources = ["../target/release/dotlink_camera.dll"]

[package.metadata.packager.deb]
depends = ["libxkbcommon-x11-0", "libnotify-bin", "pipewire-bin", "ffmpeg"]
# cargo-packager names the file after the binary (dotlink.desktop); StartupWMClass still ties
# the window to it.
desktop-template = "assets/dev.dotlink.Dotlink.desktop"

# TODO(macos): signing-identity, notarization, minimum-system-version; an .icns from assets/icons.
# Windows: `cargo packager --release -f nsis` (NSIS is downloaded by cargo-packager). A per-user
# install, no admin; Setup adds the firewall rule and the camera with one UAC prompt each.
# TODO(windows): Authenticode signing (`[package.metadata.packager.windows]` signing-command).
[package.metadata.packager.nsis]
installer-mode = "currentUser"
installer-icon = "assets/dotlink.ico"

# `cargo generate-rpm -p app` (cargo install cargo-generate-rpm), after
# `cargo build --release -p dotlink`. Writes desktop/target/generate-rpm/dotlink-*.rpm.
[package.metadata.generate-rpm]
summary = "Link your Android phone with this PC"
# TODO: the project has no license yet; set it here (and `license` in the workspace) once chosen.
license = "Unspecified"
assets = [
    { source = "target/release/dotlink", dest = "/usr/bin/dotlink", mode = "755" },
    { source = "assets/dev.dotlink.Dotlink.desktop", dest = "/usr/share/applications/dev.dotlink.Dotlink.desktop", mode = "644" },
    { source = "assets/dotlink.svg", dest = "/usr/share/icons/hicolor/scalable/apps/dotlink.svg", mode = "644" },
    { source = "assets/icons/256x256.png", dest = "/usr/share/icons/hicolor/256x256/apps/dotlink.png", mode = "644" },
]

[package.metadata.generate-rpm.requires]
libxkbcommon-x11 = "*"
libnotify = "*"
pipewire-utils = "*"

# ffmpeg (webcam) and wl-clipboard (wlroots/KDE clipboard) are optional; Setup tells what's missing.
[package.metadata.generate-rpm.recommends]
ffmpeg-free = "*"
wl-clipboard = "*"

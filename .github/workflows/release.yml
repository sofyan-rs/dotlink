# Builds Dotlink for Linux (.deb, .AppImage, .rpm), Windows (setup .exe) and Android (APK).
#
# Push a tag like v0.2.0 to publish a GitHub release; a tag with a suffix (v0.2.0-beta.1) publishes
# a pre-release. The tag must match `version` in desktop/Cargo.toml (the Android app uses it too).
# Notes come from .github/release-notes/<tag>.md, else GitHub's generated notes. The apps check
# these releases for updates; pre-releases are offered only to installs of a pre-release.
#
# Run it from the Actions tab (workflow_dispatch) to only get the files as artifacts.
#
# Android release signing: repository secrets ANDROID_KEYSTORE_BASE64 (the .jks, base64),
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD. Releases need them (an
# update only installs over an app signed with the same key); a manual run without them signs
# with a throwaway debug key.
name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          VERSION=$(sed -nE 's/^version *= *"([^"]+)".*/\1/p' desktop/Cargo.toml | head -n1)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $VERSION in desktop/Cargo.toml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          case "$VERSION" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    # The oldest supported Ubuntu: packages need its glibc or newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev \
            libfontconfig-dev libfreetype-dev libfuse2 rpm
      - name: Packagers
        run: cargo install cargo-packager cargo-generate-rpm --locked
      - name: .deb and .AppImage
        working-directory: desktop/app
        env:
          NO_STRIP: "1"
        run: cargo packager --release -f deb,appimage
      - name: .rpm
        working-directory: desktop
        env:
          VERSION: ${{ needs.version.outputs.version }}
        # RPM versions can't hold "-": 0.2.0-beta.1 becomes 0.2.0~beta.1 (sorts before 0.2.0).
        run: cargo generate-rpm -p app -s "version = \"${VERSION//-/\~}\""
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            desktop/target/packages/*.deb
            desktop/target/packages/*.AppImage
            desktop/target/generate-rpm/*.rpm

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Packager
        run: cargo install cargo-packager --locked
      - name: Setup .exe
        working-directory: desktop/app
        run: cargo packager --release -f nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/target/packages/*-setup.exe

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Release keystore
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set; releases must be release-signed"
              exit 1
            fi
            echo "::warning::No release keystore: the APK is signed with a debug key"
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > release.jks
          cat > keystore.properties <<EOF
          storeFile=$PWD/release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - name: APK
        working-directory: android
        run: |
          ./gradlew :app:assembleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/Dotlink-$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  release:
    if: github.ref_type == 'tag'
    needs: [version, linux, windows, android]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # The Linux artifact keeps its folders (packages/, generate-rpm/): flatten everything.
      - name: Files
        # GitHub turns "~" in asset names into "." (the .rpm's 0.1.0~beta.1); rename first, so the
        # notes name the files as published.
        run: |
          mkdir dist && find artifacts -type f -exec mv -t dist {} +
          for f in dist/*~*; do [ -e "$f" ] && mv "$f" "${f//\~/.}"; done; true
      - name: Release notes
        run: |
          NOTES=".github/release-notes/$TAG.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" notes.md
          else
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" -q .body > notes.md
          fi
          file() { basename "$(ls dist/$1 | head -n1)"; }
          # The apps hide everything from this heading on (DOWNLOADS_HEADING in their updaters).
          cat >> notes.md <<MD

          ## Downloads

          | File | For |
          |---|---|
          | \`$(file '*.apk')\` | Android 10 or newer |
          | \`$(file '*-setup.exe')\` | Windows 11 (x64) |
          | \`$(file '*.deb')\` | Debian, Ubuntu and derivatives |
          | \`$(file '*.rpm')\` | Fedora, openSUSE and derivatives |
          | \`$(file '*.AppImage')\` | Any other Linux (x86_64) |

          Installed apps check for this update and install it from Settings → About (Windows, the
          AppImage and Android). Update a .deb or .rpm install by installing the new package.
          MD
      - name: Publish
        run: |
          FLAGS=()
          if [ "$PRERELEASE" = true ]; then FLAGS+=(--prerelease); fi
          gh release create "$TAG" dist/* --title "Dotlink $VERSION" --notes-file notes.md --verify-tag "${FLAGS[@]}"

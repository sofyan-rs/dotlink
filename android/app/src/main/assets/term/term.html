<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="xterm.css">
<style>
  @font-face { font-family: "Geist Mono"; src: url("file:///android_res/font/geist_mono.ttf"); }
  /* Icons used by prompts, fastfetch, eza… Fallback only: Geist Mono draws the letters. */
  /* Its glyphs are 1 em wide, the Geist Mono cell 0.6 em: without size-adjust every icon spills
     over the next cell (the space after it). Scaled, an icon fills exactly one cell. */
  @font-face { font-family: "Symbols Nerd Font Mono"; src: url("symbols-nerd-mono.ttf"); size-adjust: 60%; }
  /* Unicode symbols neither has and Android lacks or only has proportional: ⏺ ⎿ ⏵ (Claude
     Code), arrows, dingbats, braille (spinners, btop graphs), legacy computing. A subset of
     JuliaMono, see symbols-mono-LICENSE.txt. */
  @font-face { font-family: "Dotlink Symbols Mono"; src: url("symbols-mono.ttf"); }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  /* Room around the text, so it doesn't touch the rounded corners. */
  #term { position: absolute; inset: 14px 8px 14px 12px; }
  .xterm-viewport { background: #000 !important; }
</style>
</head>
<body>
<div id="term"></div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script src="addon-webgl.js"></script>
<script>
  // Kotlin side: window.Bridge (input, resize, ready). Kotlin calls termWrite / termReset / termFocus.
  const term = new Terminal({
    // Symbols before Nerd Font: both have ❯ ⚡ and a few more, and the symbols font draws them
    // at the cell's size; the Nerd Font is then only asked for its private-use icons.
    fontFamily: '"Geist Mono", "Dotlink Symbols Mono", "Symbols Nerd Font Mono", monospace',
    fontSize: 13,
    cursorBlink: true,
    scrollback: 5000,
    allowProposedApi: true,
    theme: {
      background: "#000000", foreground: "#FFFFFF", cursor: "#E5211C", cursorAccent: "#000000",
      selectionBackground: "#3A3A3A",
      black: "#1C1C1C", red: "#FF5A52", green: "#4AD991", yellow: "#F5C451", blue: "#6EA8FE",
      magenta: "#C792EA", cyan: "#5FD7D7", white: "#E6E6E6",
      brightBlack: "#808080", brightRed: "#FF7A73", brightGreen: "#6BE8A8", brightYellow: "#FFD86E",
      brightBlue: "#8DBBFF", brightMagenta: "#D7A8F0", brightCyan: "#7FE6E6", brightWhite: "#FFFFFF",
    },
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById("term"));
  // WebGL draws box lines and powerline separators itself (customGlyphs), exactly one cell
  // tall and wide, where a font's would come out too small or too wide; it's also smoother.
  // Without WebGL, or when the GPU drops the context, the DOM renderer takes over.
  try {
    const webgl = new WebglAddon.WebglAddon();
    webgl.onContextLoss(() => webgl.dispose());
    term.loadAddon(webgl);
  } catch (e) {}

  let last = "";
  function refit() {
    try { fit.fit(); } catch (e) {}
    const size = term.cols + "x" + term.rows;
    if (size !== last) { last = size; Bridge.resize(term.cols, term.rows); }
  }
  new ResizeObserver(refit).observe(document.getElementById("term"));
  window.addEventListener("resize", refit);
  window.refit = refit;

  term.onData((d) => Bridge.input(d));
  term.onBinary((d) => Bridge.input(d));

  window.termWrite = (b64) => {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    term.write(bytes);
  };
  window.termReset = () => term.reset();
  window.termFocus = () => term.focus();
  window.termFontSize = (px) => { term.options.fontSize = px; refit(); };

  // Cell size depends on the fonts: re-measure once they have loaded.
  Promise.all(['"Geist Mono"', '"Symbols Nerd Font Mono"', '"Dotlink Symbols Mono"'].map((f) => document.fonts.load("13px " + f))).then(() => {
    const family = term.options.fontFamily;
    term.options.fontFamily = "monospace"; // a real change makes xterm measure the cell again
    term.options.fontFamily = family;
    refit();
  });
  // The WebView may still be 0 px tall here; measure again once layout settles.
  refit();
  setTimeout(() => { refit(); Bridge.ready(term.cols, term.rows); }, 150);
</script>
</body>
</html>
